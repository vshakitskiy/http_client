name = "client"
version = "1.0.0"

description = "HTTP/2 & HTTP/1 gleam HTTP client"
target = "erlang"
licences = ["Apache-2.0"]
repository = { type = "github", user = "vshakitskiy", repo = "" }
links = [{ title = "Gleam", href = "https://gleam.run" }]

internal_modules = ["client/internal/*"]

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.1.0 and < 2.0.0"
gleam_http = ">= 4.3.0 and < 5.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[erlang]
extra_applications = ["ssl"]
